# Monorepo pnpm hoisted: production AAB para Play Store.
build:
  name: PedixPro production Android
  steps:
    - eas/checkout
    - eas/use_npm_token
    - run:
        name: Install monorepo and link Expo for CLI
        command: bash ./scripts/eas-prepare-monorepo.sh
    - run:
        name: Build @pedidos/shared
        command: cd ../.. && pnpm --filter @pedidos/shared run build
    - run:
        name: Build @pedidos/design-tokens
        command: cd ../.. && pnpm --filter @pedidos/design-tokens run build
    - run:
        name: Verify expo-router entry
        command: |
          node -e "const m=require('./package.json').main; if(m!=='expo-router/entry'&&m!=='./index.js'&&m!=='index.js'){console.error('main inválido:',m); process.exit(1)}; console.log('main OK:',m)"
    - eas/resolve_build_config
    - run:
        name: Expo prebuild (Android)
        command: pnpm exec expo prebuild --no-install --platform android
    - eas/configure_eas_update:
        inputs:
          throw_if_not_configured: false
    - eas/inject_android_credentials
    - eas/configure_android_version
    - eas/run_gradle
    - eas/find_and_upload_build_artifacts
